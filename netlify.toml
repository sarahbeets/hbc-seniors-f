# Netlify ne sert qu'aux données de l'équipe (dossier netlify/). Le site lui-même est publié par GitHub Pages.
[build]
  publish = "netlify/public"
  command = "echo 'Rien à construire'"
  # Netlify ne se relance que si les coulisses changent (pas pour le calendrier FFHB ni pour le site)
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1 || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml package.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
